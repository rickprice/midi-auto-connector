# Example: routing a hardware controller and a Non-Mixer-XT session into a
# single "Mains" mix bus, using capture-group pairing to avoid writing one
# [[rule]] per instrument per channel.

[backends]
alsa = true
pipewire = true

[lua]
timeout_ms = 500

[[rule]]
name = "a-pro-to-sfizz"
backend = "pipewire"
output = '^Midi-Bridge:A-PRO: 1 \(capture\)$'
input = "^Non-Mixer-XT/Piano:sfizz Control$"

[[rule]]
# Both regexes capture exactly one group (the channel number), so a
# connection is only made between pairs whose captured text matches:
# out-1 -> in-1, out-2 -> in-2, etc. This fans every Non-Mixer-XT strip's
# out-N port (Piano, Vocals, Guitar, Metronome, ...) into Mains:in-N for
# that same N, regardless of how many strips exist or how many channels
# each one has.
name = "non-mixer-to-mains"
backend = "alsa"
output = '^Non-Mixer-XT/[^:]+:out-(\d+)$'
input = '^Non-Mixer-XT/Mains:in-(\d+)$'
