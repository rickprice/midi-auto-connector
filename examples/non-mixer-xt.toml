# Example: a MIDI keyboard driving a software instrument's control port,
# plus routing that Non-Mixer-XT mixing session's audio into a single
# "Mains" mix bus -- using capture-group pairing to avoid writing one
# [[rule]] per instrument per audio channel.

[backends]
alsa = true
pipewire = true

[lua]
timeout_ms = 500

[[rule]]
name = "a-pro-to-sfizz"
backend = "pipewire"
output = '^Midi-Bridge:A-PRO: [12] \(capture\)$'
input = "^Non-Mixer-XT/Piano:sfizz Control$"

[[rule]]
name = "metronome-to-sfizz"
backend = "pipewire"
output = '^Midi-Bridge:midi-daemon:Metronome/midi-out:midi-daemon:Metronome/midi \(capture\)$'
input = "^Non-Mixer-XT/Metronome:sfizz Control$"

[[rule]]
# Mains's own stereo output goes to a physical audio interface (its
# "umc404hd_combined" PipeWire device). Channel numbering differs
# between the two sides (Mains uses out-1/out-2, the interface uses
# FL/FR), so there's no shared capture-group text to pair on -- two
# explicit rules, one per channel, is simplest and safest here.
name = "mains-out1-to-umc404hd-fl"
backend = "pipewire"
kind = "audio"
output = '^Non-Mixer-XT/Mains:out-1$'
input = '^umc404hd_combined:playback_FL$'

[[rule]]
name = "mains-out2-to-umc404hd-fr"
backend = "pipewire"
kind = "audio"
output = '^Non-Mixer-XT/Mains:out-2$'
input = '^umc404hd_combined:playback_FR$'

[[rule]]
# This is an *audio* rule (Non-Mixer-XT's strips expose audio out-N/in-N
# ports on PipeWire, not MIDI) -- kind defaults to "midi", so it must be
# set explicitly here.
#
# Both regexes capture exactly one group (the channel number: the
# instrument-name alternation on the output side is a non-capturing
# `(?:...)` group so it doesn't count as a second one), so a connection
# is only made between pairs whose captured text matches: out-1 -> in-1,
# out-2 -> in-2, etc. This fans each named instrument's out-N port into
# Mains:in-N for that same N.
#
# The instrument names are listed explicitly rather than matched with a
# wildcard like `[^:]+` -- Mains has its own out-1/out-2 ports too (its
# main output, presumably to an audio interface), and a wildcard would
# match those and wire Mains's output back into its own input, an audio
# feedback loop.
name = "non-mixer-to-mains"
backend = "pipewire"
kind = "audio"
output = '^Non-Mixer-XT/(?:Metronome|Piano|Vocals|Guitar):out-(\d+)$'
input = '^Non-Mixer-XT/Mains:in-(\d+)$'
